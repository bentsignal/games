name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Release current main after all checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            script: typecheck
          - name: Lint
            script: lint
          - name: Format
            script: format:check
          - name: Tests
            script: test
          - name: Worker integration
            script: grams:test
          - name: Build
            script: build
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.script }}

  release:
    name: Production release
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.PRODUCTION_RELEASES_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Production
      url: https://games.bentsignal.com
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      VITE_CONVEX_URL: https://api.games.bentsignal.com
      VITE_GRAMS_URL: https://games-grams.shawnrodgers266.workers.dev
      VITE_DEV_AUTH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip superseded main commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/bentsignal/games/git/ref/heads/main --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping this release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        if: steps.current.outputs.release == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.current.outputs.release == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.current.outputs.release == 'true'
      - name: Build, validate, and release
        if: steps.current.outputs.release == 'true'
        run: node scripts/release.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CHECK_PRODUCTION_DOMAIN: ${{ vars.CHECK_PRODUCTION_DOMAIN }}
      - name: Preserve release manifest
        if: always() && steps.current.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/manifest.json
          retention-days: 30
          if-no-files-found: warn
