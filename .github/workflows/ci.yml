name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            script: typecheck
          - name: Lint
            script: lint
          - name: Format
            script: format:check
          - name: Tests
            script: test
          - name: Worker integration
            script: grams:test
          - name: React Compiler
            script: check:react-compiler
          - name: Build
            script: build
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.script }}

  preview:
    name: Stable preview deployment
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.STABLE_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Preview
      url: https://preview.games.bentsignal.com
    concurrency:
      group: stable-preview-deployment
      cancel-in-progress: false
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      VITE_CONVEX_URL: https://chatty-okapi-416.convex.cloud
      VITE_GRAMS_URL: https://bentsignal-games-server-preview.shawnrodgers266.workers.dev
      VITE_DEV_AUTH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip superseded main commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/bentsignal/games/git/ref/heads/main --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping this preview." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy stable preview
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/deploy-preview.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Preserve preview manifest
        if: always() && steps.current.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/preview-manifest.json
          retention-days: 90
          if-no-files-found: error
